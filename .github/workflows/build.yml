name: Build CaseLight

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install project
        run: python -m pip install ".[build,test]"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: pyinstaller --noconfirm --clean CaseLight.spec
      - uses: actions/upload-artifact@v4
        with:
          name: CaseLight-${{ runner.os }}
          path: |
            dist/CaseLight
            dist/CaseLight.exe
          if-no-files-found: error
